name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract all zip files if present
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Unzipping $f..."
            unzip -o "$f"
          done

      - name: Find Project Directory containing gradlew
        id: find_gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found anywhere!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew at $GRADLEW_PATH"
          echo "Project directory is $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          cd "${{ steps.find_gradle.outputs.project_dir }}"
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "${{ steps.find_gradle.outputs.project_dir }}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadarNews-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
