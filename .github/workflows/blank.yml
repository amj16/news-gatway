name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Project Directory containing gradlew
        id: find_gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found anywhere in repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew at $GRADLEW_PATH"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Create required .env file
        run: |
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > "${{ steps.find_gradle.outputs.project_dir }}/.env"

      - name: Generate debug keystore
        run: |
          cd "${{ steps.find_gradle.outputs.project_dir }}"
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          cd "${{ steps.find_gradle.outputs.project_dir }}"
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "${{ steps.find_gradle.outputs.project_dir }}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadarNews-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
